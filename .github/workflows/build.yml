name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 框架依赖版
        run: dotnet publish app/MdCoinWatch.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out-lite

      - name: 自带运行时版
        run: dotnet publish app/MdCoinWatch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=true -p:IncludeNativeLibrariesForSelfExtract=true -o out-full

      - name: 归拢产物
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item out-full/MdCoinWatch.exe release/MdCoinWatch.exe
          Copy-Item out-lite/MdCoinWatch.exe release/MdCoinWatch-lite.exe
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MdCoinWatch
          path: release/*.exe

      - name: 发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
